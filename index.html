<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GrabIt — Video Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-charcoal: #111111;
    --card-charcoal: #1a1a1a;
    --border-charcoal: #2d2d2d;
    --crimson: #d92b3a;
    --crimson-hover: #f03a4b;
    --crimson-glow: rgba(217, 43, 58, 0.2);
    --off-white: #f4f1ea;
    --muted: #8c8c8c;
    --error-bg: rgba(217, 43, 58, 0.1);
    --radius: 12px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0; padding: 0;
    min-height: 150vh; /* Forces a scrollbar so you can test the effect */
    background-color: var(--bg-charcoal);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(217, 43, 58, 0.08), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(217, 43, 58, 0.05), transparent 25%);
    background-attachment: fixed;
    color: var(--off-white);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 140px 20px 80px; 
    line-height: 1.6;
  }

  /* =========================================
     FROSTED NAV BAR (DeepSeek Style)
     ========================================= */
  #navbar {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    
    /* Initial large state (Frosted Glass) */
    width: calc(100% - 40px);
    max-width: 680px;
    height: 80px;
    background: rgba(26, 26, 26, 0.4);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 100px;
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    
    /* Springy rubber transition */
    transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Scrolled Shrunk State */
  #navbar.scrolled {
    top: 16px;
    width: 60px;
    height: 60px;
    /* Make it darker and blurrier when shrunk */
    background: rgba(26, 26, 26, 0.85);
    backdrop-filter: blur(24px) saturate(200%);
    -webkit-backdrop-filter: blur(24px) saturate(200%);
    border: 1px solid rgba(217, 43, 58, 0.3); /* subtle red border */
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(217, 43, 58, 0.1);
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--off-white);
    margin: 0;
    line-height: 1;
    /* Smooth fade out */
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  
  .nav-logo span {
    color: var(--crimson);
    font-style: italic;
    font-weight: 600;
  }

  /* Hide the logo when scrolled */
  #navbar.scrolled .nav-logo {
    opacity: 0;
    transform: scale(0.8) translateY(10px);
    pointer-events: none;
  }

  /* A tiny glowing red dot that appears inside the shrunk pill */
  .nav-dot {
    position: absolute;
    width: 12px;
    height: 12px;
    background: var(--crimson);
    border-radius: 50%;
    opacity: 0;
    transform: scale(0);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 16px var(--crimson);
  }
  #navbar.scrolled .nav-dot {
    opacity: 1;
    transform: scale(1);
    transition-delay: 0.1s;
  }

  /* =========================================
     MAIN CONTENT
     ========================================= */
  main { 
    width: 100%; 
    max-width: 680px; 
    position: relative; 
    z-index: 1; 
  }

  .card {
    background: var(--card-charcoal);
    border: 1px solid var(--border-charcoal);
    border-radius: var(--radius);
    padding: 32px;
    box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.8);
  }

  /* Form Elements */
  .form { display: flex; gap: 12px; }
  input[type=url] {
    flex: 1;
    width: 100%;
    padding: 18px;
    border-radius: 8px;
    border: 1px solid var(--border-charcoal);
    background: #141414;
    color: var(--off-white);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    transition: all 0.2s ease;
  }
  input[type=url]:focus {
    border-color: var(--crimson);
    box-shadow: 0 0 0 3px var(--crimson-glow);
  }
  input::placeholder { color: #555; }

  button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    cursor: pointer;
    border: 0;
    border-radius: 8px;
    transition: all 0.2s ease;
    font-size: 15px;
  }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-primary {
    padding: 0 32px;
    background: var(--crimson);
    color: var(--off-white);
    min-height: 54px;
    box-shadow: 0 8px 24px -8px var(--crimson-glow);
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--crimson-hover);
    box-shadow: 0 12px 28px -6px var(--crimson-glow);
  }

  /* Status & Error Messages */
  .status {
    margin-top: 0; padding: 0 16px; border-radius: 8px; font-size: 14px;
    display: flex; align-items: center; gap: 12px;
    opacity: 0; max-height: 0; overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid transparent;
  }
  .status.show { opacity: 1; max-height: 200px; padding: 16px; margin-top: 20px; }
  .status.info { background: rgba(255, 255, 255, 0.03); border-color: var(--border-charcoal); color: var(--off-white); }
  .status.err  { background: var(--error-bg); border-color: rgba(217, 43, 58, 0.3); color: #ff8c97; }
  .status.ok   { background: rgba(46, 204, 113, 0.1); border-color: rgba(46, 204, 113, 0.3); color: #2ecc71; }

  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--off-white);
    border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Progress Bar */
  .progress { margin-top: 20px; height: 6px; border-radius: 99px; background: #141414; overflow: hidden; display: none; }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--crimson), #ff6b7a);
    transition: width 0.3s ease;
  }

  /* Quality Buttons */
  .qualities { display: none; margin-top: 28px; animation: slideIn 0.4s ease-out; }
  .qualities.on { display: block; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  
  .q-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .q-btn {
    padding: 16px; 
    background: #141414; 
    border: 1px solid var(--border-charcoal);
    color: var(--off-white); 
    border-radius: 8px; 
    display: flex; flex-direction: column;
    align-items: flex-start; gap: 4px; text-align: left;
  }
  .q-btn:hover:not(:disabled) {
    background: #1c1c1c; 
    border-color: var(--crimson);
    box-shadow: 0 4px 12px -4px var(--crimson-glow);
  }
  .q-btn .q-label { font-weight: 600; font-size: 16px; font-family: 'Playfair Display', serif; }
  .q-btn .q-hint { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

  /* Result Box */
  .result {
    display: none; margin-top: 24px; padding: 24px; border-radius: 8px;
    background: #141414; border: 1px solid var(--border-charcoal);
    animation: slideIn 0.4s ease-out; text-align: center;
  }
  .result.on { display: block; }
  .result p { margin: 0 0 16px; font-size: 14px; color: var(--muted); }
  .result .filename { font-weight: 600; color: var(--off-white); font-size: 16px; word-break: break-all; font-family: 'Playfair Display', serif; }
  .result a {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
    color: var(--off-white); font-weight: 500; text-decoration: none; 
    padding: 12px 24px; background: var(--crimson); border-radius: 8px; 
    transition: all 0.2s ease;
  }
  .result a:hover { background: var(--crimson-hover); box-shadow: 0 8px 16px -4px var(--crimson-glow); }

  /* Cookies Dropdown */
  details#cookies {
    margin-top: 20px; border: 1px solid var(--border-charcoal); border-radius: 8px;
    background: #141414; overflow: hidden;
  }
  details#cookies summary {
    padding: 14px 18px; cursor: pointer; font-size: 13px; color: var(--muted);
    list-style: none; user-select: none; transition: color 0.2s;
  }
  details#cookies summary:hover { color: var(--off-white); }
  details#cookies summary::-webkit-details-marker { display: none; }
  details#cookies summary::before { content: '▸ '; display: inline-block; transition: transform 0.2s; }
  details#cookies[open] summary::before { transform: rotate(90deg); color: var(--crimson); }
  details#cookies.hint { border-color: rgba(217, 43, 58, 0.4); }
  details#cookies.hint summary { color: #ff8c97; }
  
  details#cookies .body { padding: 0 18px 18px; }
  details#cookies p { margin: 0 0 12px; font-size: 13px; color: var(--muted); line-height: 1.6; }
  details#cookies a { color: var(--crimson); text-decoration: none; }
  details#cookies a:hover { text-decoration: underline; }
  details#cookies textarea {
    width: 100%; min-height: 90px; padding: 12px; border-radius: 6px;
    border: 1px solid var(--border-charcoal); background: #0a0a0a; color: var(--off-white);
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
    resize: vertical; outline: none;
  }
  details#cookies textarea:focus { border-color: var(--crimson); }
  
  .actions { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  .actions button {
    padding: 8px 16px; font-size: 12px; background: #222; color: var(--off-white);
    border: 1px solid var(--border-charcoal);
  }
  .actions button:hover { border-color: var(--crimson); }
  #cookie-status { font-size: 12px; color: var(--crimson); font-weight: 500; margin-left: auto; }

  footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--muted); letter-spacing: 0.5px; }

  @media (max-width: 520px) {
    body { padding: 120px 16px 40px; }
    .card { padding: 20px; }
    .form { flex-direction: column; }
    .btn-primary { padding: 16px; width: 100%; }
    #navbar { height: 60px; border-radius: 16px; }
    .nav-logo { font-size: 32px; }
    #navbar.scrolled { width: 50px; height: 50px; border-radius: 50%; }
  }
</style>
</head>
<body>

<nav id="navbar">
  <div class="nav-logo">Grab<span>It</span></div>
  <div class="nav-dot"></div>
</nav>

<main>
  <div class="card">
    <form class="form" id="form">
      <input id="url" type="url" required placeholder="Paste video URL here..." autocomplete="off" spellcheck="false" />
      <button class="btn-primary" id="go" type="submit">Fetch</button>
    </form>

    <details id="cookies">
      <summary>Advanced: Add Cookies (for age-restricted or private videos)</summary>
      <div class="body">
        <p>
          If a video fails with "Sign in", get cookies from your browser using the
          <a href="https://github.com/kairi003/Get-cookies.txt-LOCALLY" target="_blank">Get cookies.txt LOCALLY</a>
          extension. Paste them here.
        </p>
        <textarea id="cookie-input" placeholder="# Netscape HTTP Cookie File..."></textarea>
        <div class="actions">
          <button type="button" id="cookie-save">Save</button>
          <button type="button" id="cookie-clear">Clear</button>
          <span id="cookie-status"></span>
        </div>
      </div>
    </details>

    <div class="status" id="status"></div>

    <div class="progress" id="progress-wrap">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="qualities" id="qualities">
      <div class="q-grid" id="q-grid"></div>
    </div>

    <div class="result" id="result"></div>
  </div>

  <footer>
    Only download content you have the right to download.
  </footer>
</main>

<script>
/* ================================================================
   NAV BAR SCROLL LOGIC (Rubber shrink effect)
   ================================================================ */
const navbar = document.getElementById('navbar');
const urlInput = document.getElementById('url');

let isScrolled = false;

function handleScroll() {
  const scrollY = window.scrollY;
  
  // If scrolled down more than 20px, shrink the navbar
  if (scrollY > 20 && !isScrolled) {
    navbar.classList.add('scrolled');
    isScrolled = true;
  } 
  // If back at top, expand it
  else if (scrollY <= 20 && isScrolled) {
    navbar.classList.remove('scrolled');
    isScrolled = false;
  }
}

// Trigger on scroll
window.addEventListener('scroll', handleScroll, { passive: true });

// Also trigger the shrink if the user clicks or focuses the input box
urlInput.addEventListener('focus', () => {
  if (!isScrolled) {
    window.scrollTo({ top: 40, behavior: 'smooth' });
  }
});

// ================================================================
// APP LOGIC
// ================================================================
const API_BASE = '';   
const $ = (s) => document.querySelector(s);
const form         = $('#form');
const goBtn        = $('#go');
const statusEl     = $('#status');
const qualities    = $('#qualities');
const qGrid        = $('#q-grid');
const resultEl     = $('#result');
const progressWrap = $('#progress-wrap');
const progressFill = $('#progress-fill');
const cookieBox    = $('#cookies');
const cookieInput  = $('#cookie-input');
const cookieStatus = $('#cookie-status');

let currentUrl = '';
let busy = false;
let es = null;
const COOKIE_KEY = 'grabit.cookies';

/* --- Cookies --- */
cookieInput.value = localStorage.getItem(COOKIE_KEY) || '';
cookieInput.addEventListener('input', () => {
  cookieStatus.textContent = 'unsaved';
  cookieBox.classList.remove('hint');
});
$('#cookie-save').addEventListener('click', () => {
  localStorage.setItem(COOKIE_KEY, cookieInput.value);
  cookieStatus.textContent = '✓ saved';
});
$('#cookie-clear').addEventListener('click', () => {
  localStorage.removeItem(COOKIE_KEY);
  cookieInput.value = '';
  cookieStatus.textContent = '';
  cookieBox.classList.remove('hint');
});
const getCookies = () => cookieInput.value.trim();

function promptCookies(message) {
  cookieBox.classList.add('hint');
  if (!cookieBox.open) cookieBox.open = true;
  if (message) setStatus(message, 'err');
}

/* --- UI Helpers --- */
function setStatus(text, type = 'info', showSpinner = false) {
  statusEl.className = 'status show ' + type;
  statusEl.innerHTML = (showSpinner ? '<span class="spinner"></span>' : '') + `<span>${escapeHtml(text)}</span>`;
}
function clearStatus() {
  statusEl.className = 'status';
  statusEl.innerHTML = '';
}
function setProgress(pct) {
  if (pct == null) {
    progressWrap.style.display = 'none';
  } else {
    progressWrap.style.display = 'block';
    progressFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  }
}
function setBusy(b) {
  busy = b;
  goBtn.disabled = b;
  document.querySelectorAll('.q-btn').forEach(btn => btn.disabled = b);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* --- Fetch Metadata --- */
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (busy) return;
  const url = urlInput.value.trim();
  if (!url) return;

  busy = true;
  goBtn.disabled = true;
  resultEl.classList.remove('on');
  resultEl.innerHTML = '';
  qualities.classList.remove('on');
  setProgress(null);
  setStatus('Reading link…', 'info', true);

  try {
    const r = await fetch(API_BASE + '/api/info', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, cookies: getCookies() }),
    });
    
    const text = await r.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (err) {
      throw new Error('Backend unreachable. Are you on the Render.com URL? (GitHub Pages cannot run the backend).');
    }

    if (!r.ok) {
      if (data.needsCookies) promptCookies(data.error);
      else setStatus(data.error || 'Failed to read link.', 'err');
      return;
    }
    currentUrl = url;
    renderQualities(data);
    setStatus('Choose a format below', 'info');
    cookieBox.classList.remove('hint');
  } catch (err) {
    setStatus(err.message, 'err');
  } finally {
    busy = false;
    goBtn.disabled = false;
  }
});

function renderQualities(data) {
  qGrid.innerHTML = '';

  data.video.forEach((v) => {
    const btn = document.createElement('button');
    btn.className = 'q-btn';
    btn.innerHTML = `<span class="q-label">${escapeHtml(v.label)}</span><span class="q-hint">Video · MP4</span>`;
    btn.addEventListener('click', () => startDownload('video', String(v.height)));
    qGrid.appendChild(btn);
  });

  data.audio.forEach((a) => {
    const btn = document.createElement('button');
    btn.className = 'q-btn audio';
    btn.innerHTML = `<span class="q-label">MP3</span><span class="q-hint">${escapeHtml(a.label)}</span>`;
    btn.addEventListener('click', () => startDownload('audio', a.q));
    qGrid.appendChild(btn);
  });

  qualities.classList.add('on');
}

/* --- Start Download --- */
async function startDownload(kind, quality) {
  if (!currentUrl || busy) return;
  setBusy(true);
  setProgress(0);
  setStatus('Starting…', 'info', true);
  resultEl.classList.remove('on');
  resultEl.innerHTML = '';

  try {
    const r = await fetch(API_BASE + '/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: currentUrl, kind, quality, cookies: getCookies() }),
    });
    
    const text = await r.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (err) {
      throw new Error('Backend unreachable. Server returned an invalid response.');
    }

    if (!r.ok) {
      if (data.needsCookies) promptCookies(data.error);
      else setStatus(data.error || 'Could not start download.', 'err');
      setBusy(false);
      setProgress(null);
      return;
    }
    listen(data.id);
  } catch (err) {
    setStatus(err.message, 'err');
    setBusy(false);
    setProgress(null);
  }
}

/* --- Progress Listener --- */
function listen(jobId) {
  es?.close();
  es = new EventSource(API_BASE + '/api/progress/' + jobId);

  es.onmessage = (ev) => {
    const d = JSON.parse(ev.data);

    if (d.status === 'running' || d.status === 'queued') {
      setStatus(d.stage || 'Working…', 'info', true);
      setProgress(d.progress || 0);
      return;
    }

    if (d.status === 'done') {
      es.close();
      setProgress(100);
      setStatus('Ready — download starting', 'ok');
      const url = API_BASE + '/api/file/' + jobId;
      resultEl.innerHTML = `
        <p class="filename">Your file is ready.</p>
        <a href="${url}" download>Download File</a>
      `;
      resultEl.classList.add('on');
      setTimeout(() => { window.location.href = url; }, 250);
      setTimeout(() => {
        setBusy(false);
        setProgress(null);
      }, 5000);
      return;
    }

    if (d.status === 'error') {
      es.close();
      if (d.needsCookies) promptCookies(d.error);
      else setStatus(d.error || 'Download failed.', 'err');
      setBusy(false);
      setProgress(null);
    }
  };

  es.onerror = () => {
    es.close();
    setStatus('Lost connection to server.', 'err');
    setBusy(false);
    setProgress(null);
  };
}
</script>
</body>
</html>
